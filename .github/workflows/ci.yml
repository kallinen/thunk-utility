name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                node-version: [18.x, 20.x, 22.x]

        name: Node ${{ matrix.node-version }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: npm

            - run: npm ci

            # Type errors are the point of this library, so the types are checked on their own —
            # ts-jest only compiles the files a test imports.
            - name: Typecheck
              run: |
                  npx tsc --noEmit -p tsconfig.json
                  npx tsc --noEmit -p tsconfig.production.json

            - name: Test
              run: npm test

            - name: Build
              run: npm run build

            # The published entry points must resolve for both CJS and ESM consumers.
            - name: Check package exports
              run: |
                  node -e "const m = require('./lib/index.js'); if (typeof m.createThunkFactory !== 'function') throw new Error('cjs entry broken')"
                  node --input-type=module -e "import { createThunkFactory } from './lib/index.mjs'; if (typeof createThunkFactory !== 'function') throw new Error('esm entry broken')"
